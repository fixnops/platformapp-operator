# This rule is not used by the project platformapp-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the apps.fixnops.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: platformapp-operator
    app.kubernetes.io/managed-by: kustomize
  name: platformapp-editor-role
rules:
- apiGroups:
  - apps.fixnops.com
  resources:
  - platformapps
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps.fixnops.com
  resources:
  - platformapps/status
  verbs:
  - get
